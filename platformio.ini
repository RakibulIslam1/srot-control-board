; =============================================================================
;  HENGLA firmware for the SROT board — PlatformIO project (one project, SIX envs)
;    env:esp32doit-devkit-v1  → the ESP32 flight controller  (src/, excludes the others)
;    env:pico                 → the RP2350 thruster co-proc   (src/pico only)
;    env:groundstation-esp32  → the ESP32-C3 LoRa↔MAVLink ground station (src/groundstation)
;    env:second-board         → 2nd board: thruster power switch + ESP-NOW voltage TX
;    env:esp32_4way           → ESP32 DevKit BLHeli 4-way ESC flasher     (src/esp32_4way)
;    env:esp32_4way_diag      → same, bench bring-up/diagnostic build      (src/esp32_4way)
;  Flash:  pio run -t upload                  (ESP32, the default env)
;          pio run -e pico -t upload          (Pico 2 — hold BOOTSEL for the first flash)
;          pio run -e groundstation-esp32 -t upload
;          pio run -e second-board -t upload -t monitor
;          pio run -e esp32_4way -t upload    (ESP32 ESC flasher — see src/esp32_4way/README.md)
;          pio run -e esp32_4way_diag -t upload -t monitor   (bench diagnostic menu)
;  In VSCode PlatformIO, pick the env in the status-bar dropdown, then Upload.
; =============================================================================

[platformio]
default_envs = esp32doit-devkit-v1

; -------- ESP32 flight controller --------------------------------------------
[env:esp32doit-devkit-v1]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino

; Custom table: 3 MB app AND a 128 KB NVS (placed AFTER the app). The stock huge_app.csv
; gives NVS only 0x5000, which physically cannot hold this parameter set — Preferences
; stores each float as a BLOB (~3 NVS entries), so 227 params/cal keys need ~681 entries
; against 504 available, and writes failed once it filled.
;
; app0 MUST stay at 0x10000: PlatformIO hardcodes the app flash offset
; (ESP32_APP_OFFSET = board.get("upload.offset_address", "0x10000")) and does NOT read it
; from the CSV. Moving app0 makes every upload write the firmware where the bootloader will
; not look, and the board goes completely dead. See partitions_hengla.csv.
;
; Existing NVS does not survive the move: `pio run -t erase` once, then upload, then restore
; params from a Bondor export.
board_build.partitions = partitions_hengla.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Compile all of src/ EXCEPT the co-processor / ground-station / 2nd-board / flasher firmwares.
build_src_filter = +<*> -<pico/> -<groundstation/> -<esp32_4way/> -<second_board/>

build_flags =
    ; Let sources include "control/pid.h", "drivers/bno085.h", etc.
    -I src
    ; Shared ESP32<->Pico co-processor wire protocol (thruster_link_proto.h).
    -I shared
    ; Vendored MAVLink v2 headers (common + ardupilotmega dialect). See lib/mavlink/README.
    -I lib/mavlink
    -I lib/mavlink/ardupilotmega
    -D MAVLINK_COMM_NUM_BUFFERS=2
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    ; --- Sensors (P1) ---
    adafruit/Adafruit BNO08x
    ; MS5837 (Bar30) is VENDORED in lib/MS5837 — deliberately NOT a lib_deps entry.
    ; Upstream reset() compares micros() against a millis() baseline, so the mandatory
    ; post-RESET PROM-reload delay never happened and the calibration coefficients were
    ; boot-time luck (-160 C / +10 C / correct), silently corrupting DEPTH as well as
    ; temperature. Listing it here too would make the winning copy an LDF-precedence
    ; accident. See lib/MS5837/README for the three deviations.
    ; --- Thruster output (P3) ---
    ; NOTE: derdoktor667/DShotRMT (0.9.5) requires the IDF-5 RMT driver
    ; (driver/rmt_rx.h), but this platform ships arduino-esp32 2.0.17 / IDF 4.4
    ; (legacy driver/rmt.h). We implement drivers/dshot_out on the legacy RMT
    ; API instead — no library needed.
    ; --- LoRa mission radio (P10, SX127x) ---
    sandeepmistry/LoRa
    ; --- Aux expander (P8) ---
    adafruit/Adafruit PWM Servo Driver Library
    ; --- Indicators / display (P9) ---
    ; (WS2812B RGB is a custom cycle-timed bit-bang — see drivers/neopixel_rgb;
    ;  Adafruit NeoPixel is NOT used because it drives the ESP32 via RMT, which
    ;  is fully consumed by the 8 DShot channels.)
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SH110X

; MAVLink headers are vendored under lib/mavlink/ (not from the registry) —
; see that folder's README. Run the git-clone there before building Phase 2.

; -------- Pico 2 (RP2350) thruster + RPM co-processor -------------------------
; Uses the earlephilhower arduino-pico core (RP2350 support) via the community
; platform, and the bastian2001 PIO bidirectional-DShot library. Compiles ONLY
; src/pico/ (the ESP32 tree is excluded).
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_src_filter = -<*> +<pico/>
build_flags = -I shared -O2
lib_deps = https://github.com/bastian2001/pico-bidir-dshot.git

; -------- Ground station (2nd ESP32) — LoRa → MAVLink bridge ------------------
; A separate ESP32 DevKit with an SX127x wired like the control board. Receives
; the SROT black-box telemetry frame and re-emits MAVLink over USB, so Bondor
; connects to it as a normal serial link. Compiles ONLY src/groundstation/.
[env:groundstation-esp32]
platform = espressif32@^6.9.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<groundstation/>
build_flags =
    -I shared
    -I lib/mavlink
    -I lib/mavlink/ardupilotmega
    -D MAVLINK_COMM_NUM_BUFFERS=2
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    sandeepmistry/LoRa

; -------- ESP32 DevKit — BLHeli/Bluejay 4-way ESC flasher --------------------
; A utility env (NOT the flight firmware): turns a spare ESP32 DevKit V1 into a
; 4-way interface so esc-configurator.com can read / flash Bluejay / configure up to
; 4 ESCs at once over USB — like a Betaflight FC's passthrough. Single-pin half-duplex
; per ESC (no resistor). ESC1..4 signal → GP16/17/18/19, common GND, ESCs on their own
; power. Compiles ONLY src/esp32_4way/. Steps: src/esp32_4way/README.md, docs/ESC_FLASHING.md.
; Source vendored from github.com/BrushlessPower/BlHeli-Passthrough (ESP32/, see LICENSE);
; 4-ESC routing is a SROT addition. The ESC link is a hand-written single-pin bit-bang
; half-duplex UART (BitBangSerial.*) that switches the pin's MODE between input and
; output around each direction change — the same technique Betaflight/INAV use on a
; real FC (src/main/io/serial_4way_avrootloader.c) — no resistor, no extra libs.
; -------- 2nd board — thruster control board ---------------------------------
; A second ESP32 that lives with the THRUSTER battery. It reads a rotary AS5600 knob
; to switch thruster power through a MOSFET, and BROADCASTS the thruster-pack voltage
; to the control board over ESP-NOW (shared/espnow_proto.h).
;
; That broadcast is what enables two features already present in the flight firmware
; but inert without it: the mixer's battery-voltage thrust linearisation (so a timed
; move travels the same distance on a full or flat pack) and the low-thruster-battery
; failsafe. The control board's own ADC reads the ELECTRONICS pack — a different
; battery — so this is the only source for the thruster pack.
;
; Headless: the OLED moved to the SROT board, so there are no display libraries here.
; Flash:  pio run -e second-board -t upload -t monitor
; On the control board set ESPNOW_EN=1 (defaults 0) and MOT_BAT_V_MAX to the pack's
; full-charge voltage, or the data arrives and is ignored.
[env:second-board]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<second_board/>
build_flags =
    ; espnow_proto.h — the same wire format the control board compiles.
    -I shared
; No lib_deps: WiFi/ESP-NOW/Wire are all in the core.

[env:esp32_4way]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<esp32_4way/>

; Same firmware, bench bring-up/diagnostic build: skips the USB MSP/4-way protocol and
; instead runs a plain-text menu over the serial monitor (loopback self-test of the
; bit-bang timing, raw ESC-line monitor, raw send/dump of a keep-alive or BootInit
; frame) — for verifying the physical link BEFORE trusting it to esc-configurator.
; `pio run -e esp32_4way_diag -t upload -t monitor` then press 'h' for the menu.
[env:esp32_4way_diag]
extends = env:esp32_4way
build_flags = -D ESC4WAY_DIAG_MODE=1
