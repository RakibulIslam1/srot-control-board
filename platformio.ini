; =============================================================================
;  HENGLA firmware for the SROT control board — one project, THREE envs
;    env:esp32doit-devkit-v1  → the ESP32 flight controller  (src/, excludes the others)
;    env:pico                 → the RP2350 thruster co-processor (src/pico only)
;    env:second-board         → 2nd board: thruster power switch + ESP-NOW voltage TX
;
;  Flash:  pio run -t upload                     (ESP32, the default env)
;          pio run -e pico -t upload             (Pico 2 — hold BOOTSEL for the first flash)
;          pio run -e second-board -t upload -t monitor
;  In VSCode PlatformIO, pick the env in the status-bar dropdown, then Upload.
;
;  Wire protocols in shared/ tie the boards together — change one and BOTH ends must
;  be reflashed:
;    thruster_link_proto.h  ESP32 <-> Pico  (UART)
;    espnow_proto.h         2nd board -> ESP32  (ESP-NOW broadcast)
;    lora_telem_proto.h     ESP32 -> ground station  (DUPLICATED — see the file banner)
;
;  Companion repos:
;    srot-ground-station  — Bondor GCS + the ESP32-C3 LoRa bridge
;    srot-esc-flasher     — BLHeli 4-way interface for flashing Bluejay onto the ESCs
; =============================================================================

[platformio]
default_envs = esp32doit-devkit-v1

; -------- ESP32 flight controller (Hengla) -----------------------------------
[env:esp32doit-devkit-v1]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino

; 3 MB app partition: the vendored MAVLink dialect + the task set overflow the
; default 1.3 MB factory partition. NVS stays at 0x9000/0x5000, so saved params and
; calibration survive this choice.
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Everything under src/ EXCEPT the other boards' firmwares.
build_src_filter = +<*> -<pico/> -<second_board/>

build_flags =
    ; Let sources include "control/pid.h", "drivers/bno085.h", etc.
    -I src
    ; Shared wire protocols (thruster_link / espnow / lora_telem).
    -I shared
    ; Vendored MAVLink v2 headers (common + ardupilotmega dialect). See lib/mavlink/README.
    -I lib/mavlink
    -I lib/mavlink/ardupilotmega
    -D MAVLINK_COMM_NUM_BUFFERS=2
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit BNO08x
    robtillaart/MS5837
    sandeepmistry/LoRa
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SH110X

; -------- RP2350 (Pico 2) thruster co-processor ------------------------------
; Drives the 8 ESCs with bidirectional DShot (PIO) and returns per-thruster RPM.
; Compiles ONLY src/pico/.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_src_filter = -<*> +<pico/>
build_flags =
    -I shared
    -O2
lib_deps =
    https://github.com/bastian2001/pico-bidir-dshot.git

; -------- 2nd board — thruster control board ---------------------------------
; A second ESP32 that lives with the THRUSTER battery. It reads a rotary AS5600 knob
; to switch thruster power through a MOSFET, and BROADCASTS the thruster-pack voltage
; to the flight controller over ESP-NOW (shared/espnow_proto.h).
;
; That broadcast is what enables two features already present in the flight firmware
; but inert without it: the mixer's battery-voltage thrust linearisation (so a timed
; move travels the same distance on a full or flat pack) and the low-thruster-battery
; failsafe. The flight controller's own ADC reads the ELECTRONICS pack — a different
; battery — so this is the only source for the thruster pack.
;
; Headless: the OLED lives on the SROT board, so no display libraries here.
; On the flight controller set ESPNOW_EN=1 (defaults 0) and MOT_BAT_V_MAX to the
; pack's full-charge voltage, or the data arrives and is ignored.
[env:second-board]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<second_board/>
build_flags =
    ; espnow_proto.h — the same wire format the flight controller compiles.
    -I shared
; No lib_deps: WiFi/ESP-NOW/Wire are all in the core.
