; =============================================================================
;  SROT control board — one project, TWO envs
;    env:esp32doit-devkit-v1  → the ESP32 flight controller  (src/, excludes pico)
;    env:pico                 → the RP2350 thruster co-processor (src/pico only)
;
;  Flash:  pio run -t upload                 (ESP32, the default env)
;          pio run -e pico -t upload         (Pico 2 — hold BOOTSEL for the first flash)
;  In VSCode PlatformIO, pick the env in the status-bar dropdown, then Upload.
;
;  The two boards talk over a UART link framed by shared/thruster_link_proto.h.
;  Change that header and BOTH must be reflashed together.
;
;  Companion repos:
;    srot-ground-station  — Bondor GCS + the ESP32-C3 LoRa bridge
;    srot-esc-flasher     — BLHeli 4-way interface for flashing Bluejay onto the ESCs
; =============================================================================

[platformio]
default_envs = esp32doit-devkit-v1

; -------- ESP32 flight controller --------------------------------------------
[env:esp32doit-devkit-v1]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino

; 3 MB app partition: the vendored MAVLink dialect + the task set overflow the
; default 1.3 MB factory partition.
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Everything under src/ EXCEPT the Pico co-processor firmware.
build_src_filter = +<*> -<pico/>

build_flags =
    ; Let sources include "control/pid.h", "drivers/bno085.h", etc.
    -I src
    ; Shared ESP32<->Pico co-processor wire protocol (thruster_link_proto.h) and
    ; the LoRa telemetry frame (lora_telem_proto.h).
    -I shared
    ; Vendored MAVLink v2 headers (common + ardupilotmega dialect). See lib/mavlink/README.
    -I lib/mavlink
    -I lib/mavlink/ardupilotmega
    -D MAVLINK_COMM_NUM_BUFFERS=2
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit BNO08x
    robtillaart/MS5837
    sandeepmistry/LoRa
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SH110X

; -------- RP2350 (Pico 2) thruster co-processor ------------------------------
; Drives the 8 ESCs with bidirectional DShot (PIO) and returns per-thruster RPM.
; Compiles ONLY src/pico/.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_src_filter = -<*> +<pico/>
build_flags =
    -I shared
    -O2
lib_deps =
    https://github.com/bastian2001/pico-bidir-dshot.git
